name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run scheduling, rendering and window regression tests
        run: dotnet run --project tests/EyeKeeper.Tests -c Release
      - name: Publish self-contained Windows app
        run: dotnet publish src/EyeKeeper/EyeKeeper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/app
      - name: Upload Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: EyeKeeper-win-x64
          path: artifacts/app/EyeKeeper.exe
          retention-days: 14
